plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fabrilink.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fabrilink.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: the app is a native Android shell around the FabriLink web app in assets/www.
