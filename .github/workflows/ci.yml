name: FabriLink CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_fabrilink
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install backend dependencies
        run: |
          uv pip install --system -r backend/requirements/development.txt

      - name: Run Ruff Linter
        run: |
          cd backend && ruff check .

      - name: Run Black Formatter Check
        run: |
          cd backend && black --check .

      - name: Run Django Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          # config/settings/test.py reads TEST_DATABASE_URL (it falls back to in-memory SQLite).
          TEST_DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_fabrilink
          SECRET_KEY: test-secret-key-ci
        run: |
          cd backend && pytest --cov=apps

  frontend-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd frontend && npm ci

      - name: Run TypeScript Check & Build
        run: |
          cd frontend && npm run build

  mobile-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd mobile && npm ci

      - name: Type-check, unit tests & Expo dependency check
        run: |
          cd mobile && npm run check
