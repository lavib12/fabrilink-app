# Render Blueprint: FabriLink API + Postgres.
# Dashboard -> Blueprints -> New Blueprint Instance -> pick this repository.
databases:
  - name: fabrilink-db
    plan: free
    databaseName: fabrilink
    user: fabrilink

services:
  - type: web
    name: fabrilink-backend
    runtime: python
    plan: free
    branch: live
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: fabrilink-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # Passwords for the seeded accounts; read them in the service's Environment tab.
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_USER_PASSWORD
        generateValue: true
      - key: ALLOWED_HOSTS
        value: localhost
      - key: WEB_CONCURRENCY
        value: 2
